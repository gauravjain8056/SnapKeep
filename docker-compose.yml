version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapkeep-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/snapkeep
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=dev-jwt-access-secret-snapkeep-at-least-32-chars-long
      - JWT_REFRESH_SECRET=dev-jwt-refresh-secret-snapkeep-at-least-32-chars-long
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - redis
    networks:
      - snapkeep-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: snapkeep-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - snapkeep-network

  mongodb:
    image: mongo:7-jammy
    container_name: snapkeep-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - snapkeep-network

  redis:
    image: redis:7-alpine
    container_name: snapkeep-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - snapkeep-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  snapkeep-network:
    driver: bridge
